openapi: 3.1.0
info:
  title: Secure Service Desk API
  version: 1.0.0
  description: Tenant-scoped ticket operations and replay-safe webhook ingestion.
servers:
  - url: http://localhost:8000/api/v1
security:
  - demoActor: []
paths:
  /tickets:
    get:
      summary: List tickets visible to the actor
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TicketStatus'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Ticket collection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Request key was previously used with different content}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      summary: Create or replay a request-keyed ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTicket'}
      responses:
        '201':
          description: Created ticket or idempotent replay
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Ticket'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /tickets/{ticket}/transition:
    post:
      summary: Apply an authorized lifecycle transition
      parameters:
        - name: ticket
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: {$ref: '#/components/schemas/TicketStatus'}
                version: {type: integer, minimum: 1}
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Ticket'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Actor lacks the required role}
        '404': {description: Ticket is absent or not visible}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /webhooks/ticket-events:
    post:
      summary: Authenticate and record an idempotent external event
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, event_id, payload]
              properties:
                provider: {type: string, maxLength: 80}
                event_id: {type: string, maxLength: 160}
                payload: {type: object, maxProperties: 50, additionalProperties: true}
      responses:
        '200':
          description: Accepted event or safe replay
          content:
            application/json:
              schema:
                type: object
                required: [accepted, event_id, payload_fields, replayed]
                properties:
                  accepted: {type: boolean}
                  event_id: {type: string}
                  payload_fields: {type: integer}
                  replayed: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Event id was previously used with different content}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes:
    demoActor:
      type: apiKey
      in: header
      name: X-Demo-Actor
      description: Local demonstration adapter only; replace before deployment.
  schemas:
    TicketStatus:
      type: string
      enum: [new, open, pending, resolved, closed]
    Priority:
      type: string
      enum: [low, normal, high, critical]
    CreateTicket:
      type: object
      additionalProperties: false
      required: [title, description, priority, request_key]
      properties:
        title: {type: string, maxLength: 160}
        description: {type: string, maxLength: 4000}
        priority: {$ref: '#/components/schemas/Priority'}
        tags:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {type: string, maxLength: 30, pattern: '^[a-z0-9-]+$'}
        request_key: {type: string, maxLength: 100}
    Ticket:
      type: object
      required: [id, public_id, title, description, status, priority, tags, sla_due_at, version]
      properties:
        id: {type: integer}
        public_id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        status: {$ref: '#/components/schemas/TicketStatus'}
        priority: {$ref: '#/components/schemas/Priority'}
        tags: {type: array, items: {type: string}}
        sla_due_at: {type: string, format: date-time}
        sla_breached_at: {type: [string, 'null'], format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
  responses:
    Unauthorized: {description: Missing or invalid actor/signature}
    RateLimited: {description: Rate limit exceeded}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: {type: string}
              errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
