# File: Native Windows application build and real packaged PHP/Laravel workflow acceptance.
name: Native application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_package:
        description: Retain the unsigned complete package for reviewed main-source distribution
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Actual Windows Electron PHP Laravel application
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          check-latest: true
      - name: Install reviewed native build graph without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Audit complete locked graph and test actual file/CGI contracts
        run: |
          npm audit --audit-level=low
          npm run test:native
      - name: Prepare checksum-pinned current PHP and Composer without installation
        run: pwsh -NoProfile -File scripts/prepare-native-sdk.ps1
      - name: Package actual application with isolated production dependencies
        shell: pwsh
        run: |
          $sdk = Get-Content -LiteralPath .runtime/tooling/sdk.json -Raw | ConvertFrom-Json
          $env:SSD_PHP_SDK = $sdk.php
          $env:SSD_COMPOSER_PHAR = $sdk.composer
          $env:SSD_CRT_SDK = $sdk.crt
          $env:SSD_NATIVE_OUTPUT = 'release/windows'
          $env:ELECTRON_CACHE = Join-Path $PWD '.runtime/electron-cache'
          $env:ELECTRON_BUILDER_CACHE = Join-Path $PWD '.runtime/electron-builder-cache'
          node scripts/build-native.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native package build failed.' }
          $version = (Get-Item -LiteralPath release/windows/win-unpacked/SecureServiceDesk.exe).VersionInfo
          if ($version.CompanyName -ne 'Jason Stys' -or $version.FileVersion -ne '1.1.0') { throw 'Native author/version mismatch.' }
      - name: Real packaged request, role, version, search and durable restart workflows
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/archive-native.ps1 -Candidate release/windows -Proof artifacts/native/hosted
          if ($LASTEXITCODE -ne 0) { throw 'Native workflow acceptance failed.' }
      - name: Retain bounded synthetic proof only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-desk-native-proof
          path: |
            artifacts/native/hosted/*.json
            artifacts/native/hosted/*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Retain complete unsigned candidate only on explicit trusted-main request
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retain_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-desk-reviewed-candidate
          path: |
            release/windows/*.zip
            release/windows/*.sha256
          if-no-files-found: error
          retention-days: 1
