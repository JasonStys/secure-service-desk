version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      php-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      frontend-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      workflow-actions:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      container-images:
        patterns: ['*']
    open-pull-requests-limit: 2
